[project]
name = "socket-service"
version = "0.1.0"
description = "WebSocket service for real-time chat and notifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-socketio>=5.10.0",
    "redis>=5.0.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.23",
    "aiomysql>=0.3.2",
    "python-jose[cryptography]>=3.3.0",
]
